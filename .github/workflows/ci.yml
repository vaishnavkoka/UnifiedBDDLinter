name: tests

# The tool has no dependencies, so CI installs nothing. That is the point:
# if this workflow ever needs a `pip install` step to go green, the
# zero-dependency guarantee has been broken.

# Manual trigger only, to begin with. Run it by hand from the Actions tab,
# confirm all nine combinations pass, then add:
#
#   push:
#     branches: [main]
#   pull_request:
#
# Doing it in this order means a failure never attaches itself to a commit.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.8", "3.11", "3.13"]
        # ubuntu-latest moved to Ubuntu 26.04, which ships no Python 3.8
        # build (3.8 went end-of-life in October 2024). The interpreter
        # cannot be installed, so that one combination is pinned to 22.04
        # rather than dropped -- the README and the paper both claim 3.8+,
        # and this matrix is the evidence for that claim.
        exclude:
          - os: ubuntu-latest
            python-version: "3.8"
        include:
          - os: ubuntu-22.04
            python-version: "3.8"


    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run the test suite
        run: python tests/run_tests.py

      - name: Lint the bundled examples
        run: python tools/bddlint.py lint examples/ --fail-on never

      - name: Check the rule documentation is current
        run: python scripts/generate_rule_docs.py --check
